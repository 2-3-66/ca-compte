yaml
name: Video du jour

on:
  schedule:
    - cron: '0 17 * * *' # S'exécute automatiquement tous les jours à 17h GMT
  workflow_dispatch: # Permet le lancement manuel depuis l'onglet Actions

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation du système audio et vidéo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pip

      - name: Installation des dépendances Python
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests anthropic pyyaml
          fi

      - name: Exécution du pipeline vidéo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_TOKEN: ${{ secrets.MAKE_TOKEN }}
        run: |
          if [ -f pipeline.py ]; then
            python pipeline.py
          else
            echo "Erreur : Fichier pipeline.py manquant dans le dépôt."
            exit 1
          fi
