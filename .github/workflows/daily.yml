name: Video du jour

on:
  workflow_dispatch:

jobs:
  run-video:
    runs-on: ubuntu-latest
    steps:
      - name: Recupere le code
        uses: actions/checkout@v4

      - name: Installe Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lance la machine
        run: python pipeline.py
